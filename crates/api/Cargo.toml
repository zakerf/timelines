[package]
name = "api"
description = "Lambda entry point that owns every write in the timeline site"
default-run = "api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "api"
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/main.rs"

[features]
# Test-only wiring that creates the single table against floci.
floci = ["data/fixture"]

[dependencies]
aws-config = "1"
aws-sdk-cloudfront = "1"
aws-sdk-dynamodb = "1"
aws-sdk-kms = "1"
aws-sdk-s3 = "1"
aws-sdk-ssm = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
data = { path = "../data" }
jsonwebtoken = "9"
rand = "0.8"
renderer = { path = "../renderer" }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_urlencoded = "0.7"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "auth_floci"
required-features = ["floci"]

[[test]]
name = "publish_floci"
required-features = ["floci"]

[[test]]
name = "cover_floci"
required-features = ["floci"]

[[test]]
name = "import_floci"
required-features = ["floci"]

[[test]]
name = "suggestions_floci"
required-features = ["floci"]

[[test]]
name = "vote_floci"
required-features = ["floci"]

[[test]]
name = "reports_floci"
required-features = ["floci"]

[[test]]
name = "collections_floci"
required-features = ["floci"]
