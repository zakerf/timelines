name: Deploy

# PRD §11: push to main -> dev, v* tag -> prod (behind required reviewers on
# the GitHub `prod` Environment). deploy-prod is deliberately not chained to
# deploy-dev. `workflow_dispatch` re-runs a ref; rollback is "re-run the
# previous tag's run" (see docs/INFRA.md).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:2.4.0
        ports:
          - 4566:4566
        env:
          FLOCI_STORAGE_MODE: memory
          FLOCI_DEFAULT_REGION: eu-central-1
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_DEFAULT_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  build:
    name: build (native arm64)
    needs: checks
    # PRD §11: build on the same architecture the Lambda runs on. The deploy
    # jobs also run here because the renderer binary is aarch64.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the same version for local runs.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-lambda
        run: |
          # PyPI ships an aarch64 wheel; pipx is preinstalled on the runner.
          pipx install cargo-lambda==1.9.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build Lambda artifact
        run: cargo lambda build --release --arm64 -p api
      - name: Build renderer
        run: cargo build --release -p renderer --bin renderer
      - name: Stage deploy bundle
        run: |
          mkdir -p dist
          cp target/lambda/api/bootstrap.zip dist/bootstrap.zip
          cp target/release/renderer dist/renderer
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy-dev:
    name: deploy dev
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    environment: dev
    # One deploy per environment at a time; never cancel a running apply.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deploy-bundle
          path: build
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version_file: .opentofu-version
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      # (3) Upload one immutable, sha-named zip and pin the version id that
      # `apply` receives, so a concurrent run cannot swap the bytes later.
      - name: Upload immutable artifact
        id: upload
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        run: |
          key="api-${GITHUB_SHA}.zip"
          aws s3 cp build/bootstrap.zip "s3://${ARTIFACTS_BUCKET}/${key}"
          version_id=$(aws s3api head-object \
            --bucket "${ARTIFACTS_BUCKET}" \
            --key "${key}" \
            --query VersionId --output text)
          echo "key=${key}" >> "$GITHUB_OUTPUT"
          echo "version_id=${version_id}" >> "$GITHUB_OUTPUT"

      # (4) Apply the exact build, not whatever `api.zip` happens to hold.
      - name: tofu apply
        working-directory: envs/dev
        env:
          ARTIFACT_KEY: ${{ steps.upload.outputs.key }}
          ARTIFACT_VERSION: ${{ steps.upload.outputs.version_id }}
        run: |
          tofu init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=eu-central-1" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
          tofu apply -auto-approve \
            -var "api_artifact_key=${ARTIFACT_KEY}" \
            -var "api_artifact_version=${ARTIFACT_VERSION}"

      # (5) Render the full site from this environment's DynamoDB.
      - name: Render site
        working-directory: envs/dev
        run: |
          # upload-artifact/download-artifact does not preserve the exec bit.
          chmod +x "$GITHUB_WORKSPACE/build/renderer"
          "$GITHUB_WORKSPACE/build/renderer" \
            --out "$GITHUB_WORKSPACE/site" \
            --table "$(tofu output -raw data_table_name)"

      # (6) `--delete` makes the site bucket an exact mirror of the render.
      # Constraint (PRD §11): cover images live in the `media` bucket, never in
      # `site`, so this step cannot wipe user uploads.
      - name: Sync site bucket
        working-directory: envs/dev
        run: |
          aws s3 sync "$GITHUB_WORKSPACE/site/" \
            "s3://$(tofu output -raw site_bucket_name)/" \
            --delete --cache-control "max-age=86400"

      # (7) Invalidate `/` and wait, so the smoke test cannot read stale pages.
      - name: Invalidate CloudFront
        working-directory: envs/dev
        run: |
          param=$(tofu output -raw cdn_distribution_id_param_name)
          distribution=$(aws ssm get-parameter \
            --name "$param" --query Parameter.Value --output text)
          invalidation=$(aws cloudfront create-invalidation \
            --distribution-id "$distribution" \
            --paths "/*" \
            --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$distribution" --id "$invalidation"

      # (8) Smoke `/` plus one page the renderer just produced. Deriving the
      # page from the render keeps this honest without hard-coding a Timeline.
      - name: Smoke test
        working-directory: envs/dev
        run: |
          domain=$(tofu output -raw cdn_distribution_domain_name)
          curl -fsS "https://${domain}/" > /dev/null
          page=$(cd "$GITHUB_WORKSPACE/site" && find . -type f -name '*.html' \
            ! -path './index.html' ! -path './404.html' | sort | sed -n '1p')
          if [ -z "$page" ]; then
            echo "no page besides / and 404.html was rendered" >&2
            exit 1
          fi
          path="${page#./}"
          path="${path%.html}"
          curl -fsS "https://${domain}/${path}" > /dev/null
          echo "smoke ok: https://${domain}/ and https://${domain}/${path}"

  deploy-prod:
    name: deploy prod
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    # Required reviewers live on this Environment (PRD §11); the workflow
    # cannot approve it, and prod trusts only `environment:prod`.
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deploy-bundle
          path: build
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version_file: .opentofu-version
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      # Same build bytes as dev: promotion is "apply this sha in the other
      # account", never a rebuild.
      - name: Upload immutable artifact
        id: upload
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        run: |
          key="api-${GITHUB_SHA}.zip"
          aws s3 cp build/bootstrap.zip "s3://${ARTIFACTS_BUCKET}/${key}"
          version_id=$(aws s3api head-object \
            --bucket "${ARTIFACTS_BUCKET}" \
            --key "${key}" \
            --query VersionId --output text)
          echo "key=${key}" >> "$GITHUB_OUTPUT"
          echo "version_id=${version_id}" >> "$GITHUB_OUTPUT"

      - name: tofu apply
        working-directory: envs/prod
        env:
          ARTIFACT_KEY: ${{ steps.upload.outputs.key }}
          ARTIFACT_VERSION: ${{ steps.upload.outputs.version_id }}
        run: |
          tofu init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=eu-central-1" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
          tofu apply -auto-approve \
            -var "api_artifact_key=${ARTIFACT_KEY}" \
            -var "api_artifact_version=${ARTIFACT_VERSION}"

      - name: Render site
        working-directory: envs/prod
        run: |
          # upload-artifact/download-artifact does not preserve the exec bit.
          chmod +x "$GITHUB_WORKSPACE/build/renderer"
          "$GITHUB_WORKSPACE/build/renderer" \
            --out "$GITHUB_WORKSPACE/site" \
            --table "$(tofu output -raw data_table_name)"

      # `site` only. Covers live in `media` and are never touched here.
      - name: Sync site bucket
        working-directory: envs/prod
        run: |
          aws s3 sync "$GITHUB_WORKSPACE/site/" \
            "s3://$(tofu output -raw site_bucket_name)/" \
            --delete --cache-control "max-age=86400"

      - name: Invalidate CloudFront
        working-directory: envs/prod
        run: |
          param=$(tofu output -raw cdn_distribution_id_param_name)
          distribution=$(aws ssm get-parameter \
            --name "$param" --query Parameter.Value --output text)
          invalidation=$(aws cloudfront create-invalidation \
            --distribution-id "$distribution" \
            --paths "/*" \
            --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$distribution" --id "$invalidation"

      - name: Smoke test
        working-directory: envs/prod
        run: |
          domain=$(tofu output -raw cdn_distribution_domain_name)
          curl -fsS "https://${domain}/" > /dev/null
          page=$(cd "$GITHUB_WORKSPACE/site" && find . -type f -name '*.html' \
            ! -path './index.html' ! -path './404.html' | sort | sed -n '1p')
          if [ -z "$page" ]; then
            echo "no page besides / and 404.html was rendered" >&2
            exit 1
          fi
          path="${page#./}"
          path="${path%.html}"
          curl -fsS "https://${domain}/${path}" > /dev/null
          echo "smoke ok: https://${domain}/ and https://${domain}/${path}"
