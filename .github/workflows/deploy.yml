name: Deploy

# PRD §11: push to main -> dev, v* tag -> prod (behind required reviewers on
# the GitHub `prod` Environment). deploy-prod is deliberately not chained to
# deploy-dev. `workflow_dispatch` re-runs a ref; rollback is "re-run the
# previous tag's run" (see docs/INFRA.md).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:2.4.0
        ports:
          - 4566:4566
        env:
          FLOCI_STORAGE_MODE: memory
          FLOCI_DEFAULT_REGION: eu-central-1
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_DEFAULT_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  build:
    name: build (native arm64)
    needs: checks
    # PRD §11: build on the same architecture the Lambda runs on. The deploy
    # jobs also run here because the renderer binary is aarch64.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the same version for local runs.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-lambda
        run: |
          # PyPI ships an aarch64 wheel; pipx is preinstalled on the runner.
          pipx install cargo-lambda==1.9.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build Lambda artifact
        run: cargo lambda build --release --arm64 -p api
      - name: Build renderer
        run: cargo build --release -p renderer --bin renderer
      - name: Stage deploy bundle
        run: |
          mkdir -p dist
          cp target/lambda/api/bootstrap.zip dist/bootstrap.zip
          cp target/release/renderer dist/renderer
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy-dev:
    name: deploy dev
    needs: build
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: dev
    # One deploy per environment at a time; never cancel a running apply.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

  deploy-prod:
    name: deploy prod
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod
    # Required reviewers live on the `prod` Environment (PRD §11); the workflow
    # cannot approve it, and prod trusts only `environment:prod`.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
