name: Deploy environment

# The PRD §11 deploy sequence, shared by `deploy-dev` and `deploy-prod` in
# deploy.yml. The caller owns the trigger, the Environment's reviewers and the
# concurrency group; this workflow only knows which environment it deploys.

on:
  workflow_call:
    inputs:
      environment:
        description: Environment directory and state key (dev or prod).
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: deploy ${{ inputs.environment }}
    runs-on: ubuntu-24.04-arm
    # Required reviewers live on the GitHub Environment (PRD §11); prod's trust
    # policy accepts only `environment:prod`, so this gate is the only way in.
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deploy-bundle
          path: build
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version_file: .opentofu-version
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      # (3) Upload one immutable, sha-named zip and pin the version id that
      # `apply` receives, so a concurrent run cannot swap the bytes later.
      # Promotion is not a rebuild: dev and prod upload/apply the same key.
      - name: Upload immutable artifact
        id: upload
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        run: |
          key="api-${GITHUB_SHA}.zip"
          aws s3 cp build/bootstrap.zip "s3://${ARTIFACTS_BUCKET}/${key}"
          version_id=$(aws s3api head-object \
            --bucket "${ARTIFACTS_BUCKET}" \
            --key "${key}" \
            --query VersionId --output text)
          echo "key=${key}" >> "$GITHUB_OUTPUT"
          echo "version_id=${version_id}" >> "$GITHUB_OUTPUT"

      # (4) Apply the exact build, not whatever `api.zip` happens to hold.
      - name: tofu apply
        working-directory: envs/${{ inputs.environment }}
        env:
          ARTIFACT_KEY: ${{ steps.upload.outputs.key }}
          ARTIFACT_VERSION: ${{ steps.upload.outputs.version_id }}
        run: |
          tofu init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=eu-central-1" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
          tofu apply -auto-approve \
            -var "api_artifact_key=${ARTIFACT_KEY}" \
            -var "api_artifact_version=${ARTIFACT_VERSION}"

      # (5) Render the full site from this environment's DynamoDB.
      - name: Render site
        working-directory: envs/${{ inputs.environment }}
        run: |
          # upload-artifact/download-artifact does not preserve the exec bit.
          chmod +x "$GITHUB_WORKSPACE/build/renderer"
          "$GITHUB_WORKSPACE/build/renderer" \
            --out "$GITHUB_WORKSPACE/site" \
            --table "$(tofu output -raw data_table_name)"

      # (6) `--delete` makes the site bucket an exact mirror of the render.
      # Constraint (PRD §11): cover images live in the `media` bucket, never in
      # `site`, so this step cannot wipe user uploads.
      - name: Sync site bucket
        working-directory: envs/${{ inputs.environment }}
        run: |
          aws s3 sync "$GITHUB_WORKSPACE/site/" \
            "s3://$(tofu output -raw site_bucket_name)/" \
            --delete --cache-control "max-age=86400"

      # (7) Invalidate `/` and wait, so the smoke test cannot read stale pages.
      - name: Invalidate CloudFront
        working-directory: envs/${{ inputs.environment }}
        run: |
          param=$(tofu output -raw cdn_distribution_id_param_name)
          distribution=$(aws ssm get-parameter \
            --name "$param" --query Parameter.Value --output text)
          invalidation=$(aws cloudfront create-invalidation \
            --distribution-id "$distribution" \
            --paths "/*" \
            --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$distribution" --id "$invalidation"

      # (8) Smoke `/` plus one page the renderer just produced. Deriving the
      # page from the render keeps this honest without hard-coding a Timeline.
      - name: Smoke test
        working-directory: envs/${{ inputs.environment }}
        run: |
          domain=$(tofu output -raw cdn_distribution_domain_name)
          curl -fsS "https://${domain}/" > /dev/null
          page=$(cd "$GITHUB_WORKSPACE/site" && find . -type f -name '*.html' \
            ! -path './index.html' ! -path './404.html' | sort | sed -n '1p')
          # A site with no Timelines yet still renders `/timelines`, an empty
          # list. That is a valid deploy: smoke it instead of failing. If the
          # render produced no list either, the curl below fails loudly.
          page="${page:-./timelines.html}"
          path="${page#./}"
          path="${path%.html}"
          curl -fsS "https://${domain}/${path}" > /dev/null
          echo "smoke ok: https://${domain}/ and https://${domain}/${path}"
