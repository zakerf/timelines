# Local stand-in for the production CloudFront distribution (modules/cdn).
#
# One origin, three behaviors mirroring CloudFront:
#   /api/*   -> the API (host-run process, reached via the Docker host gateway)
#   /media/* -> the media bucket (immutable cover objects)
#   default  -> the rendered-pages bucket, with the extensionless rewrite and
#               403/404 mapped to the not-found page (PRD §4)
#
# Mounted at /etc/nginx/conf.d/default.conf; the nginx image's main config
# already includes that directory.

server {
    listen 80;
    server_name _;

    # Cover uploads proxy through here; the API allows up to 4 MiB, so leave
    # headroom over nginx's 1m default.
    client_max_body_size 6m;

    # Writes. No trailing slash on proxy_pass: forward the full URI, because the
    # API mounts every route under /api/* and needs the prefix intact.
    location /api/ {
        proxy_pass http://host.docker.internal:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cover images: /media/<key> resolves to the media bucket object <key>.
    location /media/ {
        proxy_pass http://floci:4566/timeline-local-media/;
    }

    # Reads. Mirror modules/cdn/rewrite.js: a trailing slash becomes index.html,
    # an extensionless last segment gains .html, anything with a dot is left
    # alone. floci serves the site bucket by path, the way CloudFront does via
    # Origin Access Control.
    location / {
        rewrite ^/$ /index.html break;
        rewrite ^(.*)/$ $1/index.html break;
        rewrite ^/(?!.*\.[^/]*$)(.+)$ /$1.html break;
        proxy_pass http://floci:4566/timeline-local-site/;

        # With OAC and no ListBucket, S3 answers a missing object with 403;
        # map both 403 and 404 to the rendered not-found page.
        proxy_intercept_errors on;
        error_page 403 404 =404 /404.html;
    }

    # Serve the not-found page without re-entering the rewrite/error handling,
    # so a missing object can never loop.
    location = /404.html {
        proxy_pass http://floci:4566/timeline-local-site/404.html;
    }
}
