name: timeline-site

services:
  floci:
    image: floci/floci:2.4.0
    ports:
      - "4566:4566"
    environment:
      # Ephemeral local state; matches the CI service container.
      FLOCI_STORAGE_MODE: memory
      FLOCI_DEFAULT_REGION: eu-central-1
    volumes:
      # Needed by floci services that launch real containers (Lambda, RDS, ...).
      - /var/run/docker.sock:/var/run/docker.sock

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev"]
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Local-only realm; provider choice for production is deliberately deferred.
      KC_HTTP_ENABLED: "true"
